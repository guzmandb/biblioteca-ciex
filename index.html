<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Biblioteca CIEX - Centro de Investigación Estadístico Exequial</title>
  <meta name="description" content="Biblioteca digital del Centro de Investigación Estadístico Exequial (CIEX). Accede a documentos, estadísticas de mortalidad, investigaciones del sector funerario, dashboards y recursos académicos de Colombia y Latinoamérica." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

  <!-- Open Graph -->
  <meta property="og:title" content="Biblioteca CIEX - Centro de Investigación Estadístico Exequial" />
  <meta property="og:description" content="Accede a documentos, estadísticas, investigaciones, dashboards y recursos académicos del sector funerario en Colombia." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://biblioteca-ciex.vercel.app/img/banner-ciex.png" />
  <meta property="og:image:width" content="800" />
  <meta property="og:image:height" content="400" />
  <meta property="og:url" content="https://biblioteca-ciex.vercel.app" />
  <meta property="og:site_name" content="Biblioteca CIEX" />
  <meta property="og:locale" content="es_CO" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Biblioteca CIEX - Centro de Investigación Estadístico Exequial" />
  <meta name="twitter:description" content="Documentos, estadísticas, investigaciones y recursos del sector funerario en Colombia." />
  <meta name="twitter:image" content="https://biblioteca-ciex.vercel.app/img/banner-ciex.png" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://www.googletagmanager.com" />
  <link rel="preconnect" href="https://biblioteca-ciex.goatcounter.com" />

  <link rel="canonical" href="https://biblioteca-ciex.vercel.app/" />
  <link rel="icon" href="img/ciex-logo.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="img/ciex-logo.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- Datos estructurados JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Biblioteca CIEX",
    "alternateName": "Centro de Investigación Estadístico Exequial",
    "url": "https://biblioteca-ciex.vercel.app",
    "description": "Biblioteca digital del CIEX con documentos, estadísticas de mortalidad, investigaciones del sector funerario, dashboards y recursos académicos.",
    "publisher": {
      "@type": "Organization",
      "name": "CIEX - Centro de Investigación Estadístico Exequial",
      "logo": {
        "@type": "ImageObject",
        "url": "https://biblioteca-ciex.vercel.app/img/ciex-logo.png"
      }
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://biblioteca-ciex.vercel.app/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <header>
    <button id="menuToggle">☰</button>
    <a href="#" onclick="window.location.reload()"><img src="img/ciex-logo.png" alt="Centro de Investigación Estadístico Exequial - CIEX Logo" id="logo"></a>
    <h1><a href="#" onclick="window.location.reload()">Biblioteca CIEX</a></h1>
    <div class="search-wrapper">
      <button id="searchToggle" type="button" aria-label="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <input type="text" id="searchInput" placeholder="Buscar...">
      <button id="searchClear" type="button" aria-label="Limpiar búsqueda">&times;</button>
    </div>
  </header>

  <div class="container">
    <div id="sidebarOverlay"></div>
    <aside class="sidebar" data-nosnippet>

      <!-- Filtros -->
      <div class="filter-section">
        <button id="clearFiltersBtn">🧹 Borrar filtros</button>
        <h2>Filtros</h2>
        <div class="filter-group">
          <h3>Tipo de Archivo</h3>
          <div id="typeFilters"></div>
        </div>
        <div class="filter-group">
          <h3>Temas</h3>
          <div id="topicFilters"></div>
        </div>
        <div class="filter-group">
          <h3>Año</h3>
          <select id="yearSelect"><option value="Todos">Todos</option></select>
        </div>
        <div class="filter-group">
          <h3>Autor</h3>
          <select id="authorSelect"><option value="Todos">Todos</option></select>
        </div>

        <div class="filter-group">
          <h2>Categorías</h2>
          <ul id="taxonomyList">
          <li id="homeButton" class="taxonomy-home selected">Todas</li>
      </ul>
        </div>
      </div>

    </aside>

    <main class="document-section">
      <!-- Descripción visible para crawlers -->
      <p class="seo-description">Biblioteca digital del CIEX: documentos, estadísticas de mortalidad, investigaciones del sector funerario, dashboards interactivos y recursos académicos de Colombia.</p>
      <!-- 1) Banner fijo -->
      <div id="topBanner">
        <a href="https://forms.gle/aKF8cXsa1bw8TrqUA" target="_blank" rel="noopener">
          <img src="img/banner-ciex.png"
               alt="CIEX - Participa en nuestra Biblioteca llenando el formulario"
               width="800" height="400" fetchpriority="high">
        </a>
      </div>
      <!-- 2) Aquí solo se renderizan las tarjetas -->
      <div id="documentList"></div>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 CIEX - Biblioteca</p>
  </footer>

  <!-- Botón ir arriba -->
  <button id="scrollTopBtn" type="button" aria-label="Ir arriba">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="script.js" defer></script>
  <!-- Analytics (solo en producción, manejado por analytics.js) -->
  <script src="analytics.js" defer></script>
  <script data-goatcounter="https://biblioteca-ciex.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>



</body>
</html>
