<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Biblioteca CIEX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <button id="menuToggle">☰</button>
    <a href="#" onclick="window.location.reload()"><img src="img/ciex-logo.png" alt="Centro de Investigación Estadístico Exequial - CIEX Logo" id="logo"></a>
    <h1><a href="#" onclick="window.location.reload()" style="color: white;">Biblioteca CIEX</a></h1>
    <input type="text" id="searchInput" placeholder="Buscar documentos...">
  </header>

  <div class="container">
    <aside class="sidebar">
      <!-- PANEL DE FILTROS -->

      <!-- Filtros -->
      <div class="filter-section">
        <button id="clearFiltersBtn">🧹 Borrar filtros</button>
        <h2>Filtros</h2>
        <div class="filter-group">
          <h3>Tipo de Archivo</h3>
          <div id="typeFilters"></div>
        </div>
        <div class="filter-group">
          <h3>Temas</h3>
          <div id="topicFilters"></div>
        </div>
        <div class="filter-group">
          <h3>Año</h3>
          <select id="yearSelect"><option value="Todos">Todos</option></select>
        </div>
        <div class="filter-group">
          <h3>Autor</h3>
          <select id="authorSelect"><option value="Todos">Todos</option></select>
        </div>

        <div class="filter-group">
          <h2>Categorías</h2>
          <ul id="taxonomyList">
          <li id="homeButton" class="taxonomy-home selected">Todas</li>
      </ul>
        </div>
      </div>

    </aside>

    <main class="document-section">
      <!-- 1) Banner fijo -->
      <div id="topBanner">
        <a href="https://forms.gle/aKF8cXsa1bw8TrqUA" target="_blank" rel="noopener">
          <img src="img/banner-ciex.png"
               alt="CIEX - Participa en nuestra Biblioteca llenando el formulario">
        </a>
      </div>
      <!-- 2) Aquí solo se renderizan las tarjetas -->
      <div id="documentList"></div>
    </main>
  </div>

  <footer>
    <p>&copy; 2025 CIEX - Biblioteca</p>
  </footer>

  <script src="script.js"></script>
<!-- Google Analytics -->
  <script src="analytics.js"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4Z390CRL24"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4Z390CRL24');
</script>
    <script data-goatcounter="https://biblioteca-ciex.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>



</body>
</html>
